<ion-content [fullscreen]="true" class="cadastro-content">

  <div class="cadastro-bg">
    <div class="bg-circle bg-circle--1"></div>
    <div class="bg-circle bg-circle--2"></div>
  </div>

  <div class="cadastro-wrapper">

    <!-- Header -->
    <div class="cadastro-header ion-text-center">
      <div class="logo-ring">
        <img src="https://api.builder.io/api/v1/image/assets/TEMP/944de1fdba3fd4b63f21ffe1f709737088096b16?width=180"
          alt="Logo" class="logo-img" />
      </div>
      <h1 class="cadastro-title">Criar Conta</h1>
      <p class="cadastro-subtitle">Preencha seus dados para começar</p>
    </div>

    <!-- Card do formulário -->
    <div class="cadastro-card">

      <!-- Botão voltar -->
      <ion-button fill="clear" class="back-btn" routerLink="/login">
        <ion-icon slot="start" name="arrow-back-outline"></ion-icon>
        Voltar para login
      </ion-button>

      <form (ngSubmit)="onSubmit()" novalidate class="cadastro-form">

        <!-- Nome -->
        <div class="field-group">
          <div class="field-label-row">
            <ion-icon name="person-outline" class="field-icon"></ion-icon>
            <ion-label class="field-label">Nome completo</ion-label>
          </div>
          <ion-input class="input" type="text" placeholder="João da Silva"
            name="nome" [(ngModel)]="nome" required></ion-input>
        </div>

        <!-- E-mail -->
        <div class="field-group">
          <div class="field-label-row">
            <ion-icon name="mail-outline" class="field-icon"></ion-icon>
            <ion-label class="field-label">E-mail</ion-label>
          </div>
          <ion-input class="input" type="email" placeholder="seu@email.com"
            [(ngModel)]="email" name="email" required></ion-input>
        </div>

        <!-- Senha + Confirmar (lado a lado em telas maiores) -->
        <div class="field-row">
          <div class="field-group flex-1">
            <div class="field-label-row">
              <ion-icon name="lock-closed-outline" class="field-icon"></ion-icon>
              <ion-label class="field-label">Senha</ion-label>
            </div>
            <ion-input class="input" [type]="showSenha() ? 'text' : 'password'"
              placeholder="••••••••" [(ngModel)]="senha" name="senha" required>
              <ion-button slot="end" fill="clear" class="eye-btn" type="button" (click)="toggleSenha()">
                <ion-icon slot="icon-only" [name]="showSenha() ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
              </ion-button>
            </ion-input>
          </div>

          <div class="field-group flex-1">
            <div class="field-label-row">
              <ion-icon name="lock-closed-outline" class="field-icon"></ion-icon>
              <ion-label class="field-label">Confirmar</ion-label>
            </div>
            <ion-input class="input" [type]="showConfirmarSenha() ? 'text' : 'password'"
              placeholder="••••••••" [(ngModel)]="confirmarSenha" name="confirmarSenha" required>
              <ion-button slot="end" fill="clear" class="eye-btn" type="button" (click)="toggleConfirmarSenha()">
                <ion-icon slot="icon-only" [name]="showConfirmarSenha() ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
              </ion-button>
            </ion-input>
          </div>
        </div>

        <!-- Data de nascimento + CPF -->
        <div class="field-row">
          <div class="field-group flex-1">
            <div class="field-label-row">
              <ion-icon name="calendar-outline" class="field-icon"></ion-icon>
              <ion-label class="field-label">Nascimento</ion-label>
            </div>
            <ion-input class="input" type="text" placeholder="dd/mm/aaaa"
              [value]="dataNascimento" (ionInput)="onDataInput($event)"
              name="dataNascimento" maxlength="10" inputmode="numeric" required></ion-input>
          </div>

          <div class="field-group flex-1">
            <div class="field-label-row">
              <ion-icon name="card-outline" class="field-icon"></ion-icon>
              <ion-label class="field-label">CPF</ion-label>
            </div>
            <ion-input class="input" type="text" placeholder="000.000.000-00"
              [value]="cpf" (ionInput)="onCpfInput($event)"
              name="cpf" maxlength="14" inputmode="numeric" required></ion-input>
          </div>
        </div>

        <!-- CEP -->
        <div class="field-group">
          <div class="field-label-row">
            <ion-icon name="location-outline" class="field-icon"></ion-icon>
            <ion-label class="field-label">CEP</ion-label>
          </div>
          <ion-input class="input" type="text" placeholder="35920-000"
            [value]="cep" (ionInput)="onCepInput($event)"
            name="cep" maxlength="9" inputmode="numeric" required></ion-input>
        </div>

        <!-- Sou Profissional -->
        <div class="profissional-row">
          <div class="profissional-left">
            <div class="profissional-icon">
              <ion-icon name="briefcase-outline"></ion-icon>
            </div>
            <div>
              <span class="profissional-title">Sou Profissional</span>
              <span class="profissional-desc">Ofereço serviços na plataforma</span>
            </div>
          </div>
          <ion-toggle [(ngModel)]="isProfissional" name="isProfissional"
            class="profissional-toggle"></ion-toggle>
        </div>

        <!-- Submit -->
        <div class="submit-container">
          <ion-button type="submit" expand="block" class="submit-btn">
            <ion-icon slot="start" name="person-add-outline"></ion-icon>
            Criar minha conta
          </ion-button>
        </div>

        <!-- Link de login -->
        <div class="ion-text-center" style="margin-top: 12px;">
          <ion-button fill="clear" routerLink="/login" class="login-link-btn">
            Já tem conta? <strong>&nbsp;Entrar</strong>
          </ion-button>
        </div>

      </form>
    </div>

  </div>
</ion-content>
