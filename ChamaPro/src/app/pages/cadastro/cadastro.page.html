<ion-content [fullscreen]="true" class="cadastro-content">
  <div class="cadastro-wrapper">

    <!-- Header -->
    <div class="cadastro-header ion-text-center">
      <div class="logo-container">
        <img src="https://api.builder.io/api/v1/image/assets/TEMP/944de1fdba3fd4b63f21ffe1f709737088096b16?width=180"
          alt="Logo" class="logo-img" />
      </div>
      <h1 class="cadastro-title">Criar Conta</h1>
      <p class="cadastro-subtitle">Preencha seus dados para começar</p>
    </div>

    <!-- Back button -->
    <div class="back-button-container" style="padding-left: 15px;">
      <ion-button fill="clear" class="back-btn" routerLink="/login">
        <ion-icon slot="start" name="arrow-back-outline"></ion-icon>
        Voltar
      </ion-button>
    </div>

    <!-- Form -->
    <form (ngSubmit)="onSubmit()" novalidate class="cadastro-form" style="padding: 30px;">

      <!-- Nome completo -->
      <div class="field-group">
        <ion-label class="field-label">Nome completo</ion-label>
        <ion-input class="input" type="text" placeholder="João da Silva" name="nome" required
          [(ngModel)]="nome"></ion-input>
      </div>

      <!-- E-mail -->
      <div class="field-group">
        <ion-label class="field-label">E-mail</ion-label>
        <ion-input class="input" type="email" placeholder="seu@email.com" [(ngModel)]="email" name="email"
          required></ion-input>
      </div>

      <!-- Senha -->
      <div class="field-group">
        <ion-label class="field-label">Senha</ion-label>
        <ion-input class="input" [type]="showSenha() ? 'text' : 'password'" placeholder="••••••••" [(ngModel)]="senha"
          name="senha" required>
          <ion-button slot="end" fill="clear" class="eye-btn" type="button" (click)="toggleSenha()">
            <ion-icon slot="icon-only" [name]="showSenha() ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </ion-button>
        </ion-input>

      </div>

      <!-- Confirmar Senha -->
      <div class="field-group">
        <ion-label class="field-label">Confirmar senha</ion-label>
        <ion-input class="input" [type]="showConfirmarSenha() ? 'text' : 'password'" placeholder="••••••••"
          [(ngModel)]="confirmarSenha" name="confirmarSenha" required>
          <ion-button slot="end" fill="clear" class="eye-btn" type="button" (click)="toggleConfirmarSenha()">
            <ion-icon slot="icon-only" [name]="showConfirmarSenha() ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </ion-button>
        </ion-input>

      </div>

      <!-- Data de nascimento + CPF -->
      <div class="field-row">

        <!-- Data de nascimento -->
        <div class="field-group flex-1">
          <ion-label class="field-label">Data de nascimento</ion-label>
          <ion-input class="input" type="text" placeholder="dd/mm/aaaa" [value]="dataNascimento"
            (ionInput)="onDataInput($event)" name="dataNascimento" maxlength="10" inputmode="numeric"
            required></ion-input>
        </div>

        <!-- CPF -->
        <div class="field-group flex-1">
          <ion-label class="field-label">CPF</ion-label>
          <ion-input class="input" type="text" placeholder="000.000.000-00" [value]="cpf"
            (ionInput)="onCpfInput($event)" name="cpf" maxlength="14" inputmode="numeric" required></ion-input>
        </div>
      </div>

      <!-- CEP -->
      <div class="field-group">
        <ion-label class="field-label">CEP</ion-label>
        <ion-input class="input" type="text" placeholder="35920-000" [value]="cep" (ionInput)="onCepInput($event)"
          name="cep" maxlength="9" inputmode="numeric" required></ion-input>
      </div>

      <!-- Sou Profissional -->

      <div class="profissional-info">
        <span class="profissional-title">Sou Profissional</span>
        <ion-toggle slot="end" [(ngModel)]="isProfissional" name="isProfissional"
          class="profissional-toggle" style="padding-left: 10px;"></ion-toggle>
      </div>


      <!-- Submit button -->
      <div class="submit-container">
        <ion-button type="submit" expand="block" class="submit-btn">
          Cadastrar
        </ion-button>
      </div>

      <!-- Login link -->
      <div class="login-link ion-text-center">
        <ion-button fill="clear" routerLink="/login" class="login-btn">
          Já tem conta? Entrar
        </ion-button>
      </div>

    </form>
  </div>
</ion-content>
