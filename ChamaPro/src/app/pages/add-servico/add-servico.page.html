<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>addServico</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">addServico</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-item>
    <ion-text class="ion-text-center">
      <h1> Escolha os serviços que irá oferecer</h1>
    </ion-text>
  </ion-item>
  <form [formGroup]="formGroup" (ngSubmit)="salvar()" novalidate class="cadastro-form">
    <ion-item>
      <ion-select value="" okText="confirmar" cancelText="cancelar" placeholder="Selecione seus serviços"
        [multiple]="true" formControlName="servicos">
        @for (servico of todosServicos; track servico.id){
        <ion-select-option [value]="servico">
          {{ servico.nome }}
        </ion-select-option>
        }
      </ion-select>
    </ion-item>

    <div class="submit-container">
      <ion-button type="submit" expand="block" class="submit-btn">
        <ion-icon slot="start" name="person-add-outline"></ion-icon>
        Criar minha conta
      </ion-button>
    </div>
  </form>
</ion-content>
