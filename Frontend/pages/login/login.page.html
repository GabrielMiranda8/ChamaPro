<ion-content [fullscreen]="true" class="login-content">

  <div class="login-wrapper">

    <!-- Logo -->
    <div class="login-header ion-text-center">
      <div class="logo-ring">
        <img
          src="https://api.builder.io/api/v1/image/assets/TEMP/fa401b4e2c54c67d0a8f1d96b4bf6db63abc8541?width=180"
          alt="ChamaPro Logo"
          class="logo-img"
        />
      </div>
      <h1 class="brand-name">ChamaPro</h1>
      <p class="brand-sub">Serviços acessíveis para todos</p>
    </div>

    <!-- Formulário -->
    <form [formGroup]="formGroup" (ngSubmit)="autenticar()" class="login-form">

      <!-- E-mail -->
      <div class="field-group">
        <ion-label class="field-label">E-mail</ion-label>
        <ion-input
          class="input"
          type="email"
          formControlName="email"
          placeholder="seu@email.com">
        </ion-input>
      </div>

      <!-- Senha -->
      <div class="field-group">
        <ion-label class="field-label">Senha</ion-label>
        <ion-input
          class="input"
          [type]="showSenha ? 'text' : 'password'"
          formControlName="senha"
          placeholder="••••••••">
          <ion-button slot="end" fill="clear" class="eye-btn" type="button" (click)="toggleSenha()">
            <ion-icon slot="icon-only" [name]="showSenha ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </ion-button>
        </ion-input>
      </div>

      <!-- Esqueci senha -->
      <div class="forgot-row">
        <ion-button fill="clear" class="forgot-btn">Esqueci minha senha</ion-button>
      </div>

      <!-- Botão entrar -->
      <ion-button type="submit" expand="block" class="submit-btn">
        Entrar
      </ion-button>

    </form>

    <!-- Divisor -->
    <div class="divider">
      <span class="divider-line"></span>
      <span class="divider-text">ou continue com</span>
      <span class="divider-line"></span>
    </div>

    <!-- Google -->
    <ion-button expand="block" fill="outline" class="google-btn">
      Google
    </ion-button>

    <!-- Link cadastro -->
    <div class="ion-text-center signup-row">
      <span class="signup-text">Não tem conta? </span>
      <ion-button fill="clear" class="signup-link" (click)="cadastro()">
        Cadastre-se
      </ion-button>
    </div>

  </div>
</ion-content>
