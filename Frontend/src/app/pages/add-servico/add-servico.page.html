<ion-content [fullscreen]="true" class="add-servico-content">

  <div class="add-servico-wrapper">

    <!-- Header -->
    <div class="header ion-text-center">
      <div class="header-icon">
        <ion-icon name="briefcase-outline"></ion-icon>
      </div>
      <h1 class="header-title">Configure seu Perfil</h1>
      <p class="header-sub">Selecione suas especialidades e acessibilidades</p>
    </div>

    @if (carregando) {
      <div class="ion-text-center" style="padding: 40px 0;">
        <ion-spinner name="crescent"></ion-spinner>
      </div>
    } @else {

      <!-- Especialidades -->
      <div class="section">
        <h2 class="section-title">Suas Especialidades</h2>

        <div class="chips-grid">
          @for (servico of todosServicos; track servico.id) {
            <button
              type="button"
              class="chip"
              [class.chip--ativo]="isServicoSelecionado(servico)"
              (click)="toggleServico(servico)">
              {{ servico.nome }}
            </button>
          }
        </div>

        <!-- Outra especialidade -->
        <div class="outra-row">
          <ion-input
            class="outra-input"
            placeholder="Outra especialidade..."
            [(ngModel)]="outraEspecialidade">
          </ion-input>
          <button type="button" class="add-btn" (click)="adicionarOutra()">
            <ion-icon name="add-outline"></ion-icon>
          </button>
        </div>
      </div>

      <!-- Acessibilidades 
       <div class="section">
        <h2 class="section-title">Acessibilidades que você oferece</h2>

        <div class="chips-grid chips-grid--acessibilidade">
          @for (carac of todasCaracteristicas; track carac.id) {
            <button
              type="button"
              class="chip chip--acessibilidade"
              [class.chip--ativo]="isCaracSelecionada(carac)"
              (click)="toggleCarac(carac)">
              <ion-icon [name]="iconePorCaracteristica(carac.nome)" class="chip-icon"></ion-icon>
              {{ carac.nome }}
            </button>
          }
        </div>
      </div>
      -->
      

      <!-- Ações -->
      <div class="actions">
        <ion-button expand="block" class="continuar-btn" [disabled]="salvando" (click)="salvar()">
          @if (salvando) {
            <ion-spinner name="crescent"></ion-spinner>
          } @else {
            Continuar
            <ion-icon slot="end" name="arrow-forward-outline"></ion-icon>
          }
        </ion-button>
        <ion-button expand="block" fill="clear" class="pular-btn" (click)="pular()">
          Voltar ao perfil
        </ion-button>
      </div>

    }

  </div>
</ion-content>
