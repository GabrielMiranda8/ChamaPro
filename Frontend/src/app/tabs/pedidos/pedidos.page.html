<ion-content>
  <div class="container">
    <h1>Meus Pedidos</h1>
    <div
      class="pedido-card"
      *ngFor="let pedido of pedidos">
      <div class="top">
        <div>
          <h2>{{ pedido.servico }}</h2>
          <p class="profissional">
            {{ pedido.profissional }}
          </p>
        </div>
        <div class="valor">
          R$ {{ pedido.valor }}
        </div>
      </div>
      <div class="bottom">
        <span class="data">
          {{ pedido.data }}
        </span>
        <div
          class="status"
          [ngClass]="pedido.status">
          <ion-icon
            [name]="
              pedido.status === 'concluido'
              ? 'checkmark-circle-outline'
              : pedido.status === 'agendado'
              ? 'time-outline'
              : 'construct-outline'">
          </ion-icon>
          <span>
            {{
              pedido.status === 'concluido'
                ? 'Concluído'
                : pedido.status === 'agendado'
                ? 'Agendado'
                : 'Em andamento'
            }}
          </span>
        </div>
      </div>
      <button
        *ngIf="pedido.status !== 'concluido'"
        class="cancelar">
        Cancelar pedido
      </button>
    </div>
  </div>
</ion-content>
