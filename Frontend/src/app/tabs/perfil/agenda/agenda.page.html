<ion-content [fullscreen]="true" class="agenda-content">

  <div class="agenda-header">
    <ion-button fill="clear" class="back-btn" routerLink="/tabs/perfil">
      <ion-icon name="arrow-back-outline"></ion-icon>
    </ion-button>
    <h2>Minha Agenda</h2>
  </div>

  <div class="container">

    <div class="compromisso-card" *ngFor="let c of compromissos">
      <div class="data-box">
        <span class="dia-semana">{{ obterDiaSemana(c.data) }}</span>
        <span class="data">{{ c.data | date:'dd/MM' }}</span>
      </div>

      <div class="info">
        <h3>{{ c.nomeServico }}</h3>
        <p class="cliente">
          <ion-icon name="person-outline"></ion-icon>
          {{ c.nomeCliente }}
        </p>
        <p class="horario">
          <ion-icon name="time-outline"></ion-icon>
          {{ c.horaInicio }} - {{ c.horaFim }}
        </p>
      </div>
    </div>

    <div class="vazio" *ngIf="!carregando && compromissos.length === 0">
      <ion-icon name="calendar-clear-outline"></ion-icon>
      <p>Nenhum compromisso agendado.</p>
    </div>

    <ion-spinner *ngIf="carregando" name="crescent"></ion-spinner>

  </div>

</ion-content>
